[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spirality"
version = "0.88.15"
description = "FANS filament-node spirality and handedness analysis pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "scipy>=1.10",
  "astropy>=5.3",
  "healpy>=1.16",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
legacy-plots = ["pymupdf"]

[tool.setuptools.packages.find]
include = ["spirality*"]
